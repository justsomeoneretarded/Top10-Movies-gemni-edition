name: Resilient production
description: Run the resource guard while uploading bounded recovery checkpoints during production.
inputs:
  mode:
    description: run or restore; restore only reads earlier attempts of this workflow run.
    required: false
    default: run
  python:
    description: Python executable containing the pipeline environment.
    required: false
    default: python
  checkpoint-interval-seconds:
    description: Period between checkpoints (1 to 3600 seconds; 900 for production).
    required: false
    default: '900'
  command-json:
    description: Optional argv JSON for a fixed, workflow-authored smoke command; never evaluated as shell text.
    required: false
runs:
  using: node24
  main: index.cjs
