name: Verify live discovery metadata
on:
  push:
    branches: [diagnostics/verified-discovery-20261124]
    paths: [.github/workflows/verify-live-discovery.yml, scripts/verify_live_discovery.py]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install metadata client only
        run: python -m pip install 'requests>=2.32,<3'
      - name: Verify live metadata without model inference or downloads
        env:
          AI_BACKEND: local
          GEMINI_FREE_ONLY: 'true'
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
        run: python -m scripts.verify_live_discovery

