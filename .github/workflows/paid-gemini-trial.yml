name: Generate Video — Paid Gemini Trial
run-name: "Paid Gemini — 5 New Shows Worth Watching"
on:
  push:
    branches: [paid-trial-requests]
    paths: [requests/paid-trial.json]
permissions:
  contents: read
concurrency:
  group: paid-gemini-trial
  cancel-in-progress: false
jobs:
  request:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      title: ${{ steps.read.outputs.title }}
      description: ${{ steps.read.outputs.description }}
      movies: ${{ steps.read.outputs.movies }}
      content_type: ${{ steps.read.outputs.content_type }}
      narrator: ${{ steps.read.outputs.narrator }}
      tts_model: ${{ steps.read.outputs.tts_model }}
      narration_speed: ${{ steps.read.outputs.narration_speed }}
      duration_minutes: ${{ steps.read.outputs.duration_minutes }}
      try_4k: ${{ steps.read.outputs.try_4k }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        name: Validate one approved paid request
        shell: python
        run: |
          import json, os
          from pathlib import Path
          if os.environ["GITHUB_RUN_ATTEMPT"] != "1":
              raise SystemExit("Paid reruns disabled: a new runner resets its spend ledger.")
          request = json.loads(Path("requests/paid-trial.json").read_text())
          fields = {"title": str, "description": str, "movies": str, "content_type": str,
                    "narrator": str, "tts_model": str, "narration_speed": str,
                    "duration_minutes": str, "try_4k": bool}
          if any(type(request.get(k)) is not kind for k, kind in fields.items()):
              raise SystemExit("Invalid paid request fields")
          if not 1 <= len(request["title"]) <= 100 or not 1 <= len(request["description"]) <= 12000:
              raise SystemExit("Invalid title or brief length")
          if len(request["movies"].split(";")) != 5 or request["content_type"] != "Shows":
              raise SystemExit("This approved trial requires five shows")
          if (request["narrator"], request["tts_model"], request["narration_speed"], request["duration_minutes"]) != ("Warguy", "original", "1.2", "Auto"):
              raise SystemExit("Trial preserves Warguy, Original Chatterbox, speed 1.2 and Auto length")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for field in fields:
                  output.write(field + "=" + json.dumps(request[field], ensure_ascii=False) + "\n")
          print("Validated paid test:", request["title"])
  produce:
    needs: request
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      VIDEO_TITLE: ${{ fromJSON(needs.request.outputs.title) }}
      VIDEO_BRIEF: ${{ fromJSON(needs.request.outputs.description) }}
      MOVIE_LIST: ${{ fromJSON(needs.request.outputs.movies) }}
      VIDEO_TYPE: ${{ fromJSON(needs.request.outputs.content_type) }}
      NARRATOR: ${{ fromJSON(needs.request.outputs.narrator) }}
      NARRATION_SPEED: "${{ fromJSON(needs.request.outputs.narration_speed) }}"
      TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
      # Dedicated paid key only; the normal/free workflow is unchanged.
      AI_BACKEND: gemini
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_PRO }}
      GEMINI_API_KEY_2: ''
      GEMINI_API_KEY_3: ''
      GEMINI_TEXT_MODEL: gemini-3.8-flash
      GEMINI_VISION_MODEL: gemini-3.8-flash
      GEMINI_RESEARCH_MODEL: gemini-3.8-flash
      GEMINI_RESEARCH_MODE: public_sources
      GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL || 'gemini-3.8-flash-tts' }}
      # Keep Warguy's identity. No cloud stock voice or enrollment in this trial.
      GEMINI_VOICE_WARGUY: ''
      GEMINI_VOICE_KIT_LASER: ''
      GEMINI_VOICE_FEMALE: ''
      # Paid mode requires both gates. One durable ledger covers every process.
      GEMINI_FREE_ONLY: 'false'
      GEMINI_PAID_TRIAL: 'true'
      GEMINI_SCRIPT_MODEL: gemini-4-carbon
      GEMINI_VIDEO_MODEL: gemini-3.8-flash
      GEMINI_PAID_BUDGET_PATH: work/runner-diagnostics/paid-budget.json
      GEMINI_PAID_MAX_USD: '5'
      GEMINI_PAID_MAX_REQUESTS: '100'
      GEMINI_PAID_MAX_INPUT_TOKENS: '2000000'
      GEMINI_PAID_MAX_OUTPUT_TOKENS: '500000'
      GEMINI_MAX_REQUESTS: '100'
      GEMINI_MAX_VIDEO_SECONDS: '6000'
      GEMINI_MIN_INTERVAL_SECONDS: '3'
      GEMINI_MAX_RETRIES: '0'
      GEMINI_TIMEOUT_SECONDS: '900'
      GEMINI_USAGE_REPORT: work/gemini-usage-produce.jsonl
      GEMINI_PREFLIGHT_REPORT: work/gemini-preflight-produce.json
      # Fixed comparison voice; the single producer handles all stages.
      TTS_MODEL: original
      SCRIPT_MODEL: gemma4:12b
      TRY_4K: "${{ fromJSON(needs.request.outputs.try_4k) }}"
      VIDEO_MINUTES: "${{ fromJSON(needs.request.outputs.duration_minutes) }}"
      THUMBNAIL_AI: 'true'
      # 'stills' (default): official TMDB stills with face-aware framing; 'ai': the generated-scene designs.
      THUMBNAIL_SOURCE: stills
      # 'none' (default): text-free thumbnails; 'minimal': a 2-3 word label on the panels option.
      THUMBNAIL_TEXT: none
      # One final video for this trial.
      COMPARISON_EXPORT: 'false'
      U2NET_HOME: ${{ github.workspace }}/work/models/rembg
      OLLAMA_HOST: 127.0.0.1:11435
      OLLAMA_URL: http://127.0.0.1:11435
      # Keep the 12B script model within the runner's 16 GB: one model, one request, compressed KV cache.
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_FLASH_ATTENTION: '1'
      OLLAMA_KV_CACHE_TYPE: q8_0
      HF_HUB_DISABLE_XET: '1'
      HF_HOME: ${{ github.workspace }}/work/models/huggingface
      TORCH_HOME: ${{ github.workspace }}/work/models/torch
      SPEECH_VERIFY_MODEL_DIR: ${{ github.workspace }}/work/speech-verifier-model
      # Pulled fresh each run (about 40 seconds); too large for the shared 10 GB Actions cache.
      OLLAMA_MODELS: ${{ github.workspace }}/work/ollama-models
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disk before model tools and caches
        run: python3 -m scripts.runner_disk --stage produce
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add swap space as a memory safety margin
        continue-on-error: true
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 12G /mnt/swapfile && sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile
          free -h
      - name: System dependencies
        timeout-minutes: 35
        run: bash scripts/install_system_packages.sh ffmpeg libsndfile1 fonts-dejavu-core zstd tesseract-ocr
      - name: Install light dependencies and validate inputs
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m scripts.preflight
      - name: Verify paid access using the shared trial budget
        run: python -m scripts.paid_trial_preflight
      - name: Restore shot analyses from earlier runs
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: work/analysis-cache
          key: shot-analysis-v1-${{ github.run_id }}
          restore-keys: shot-analysis-v1-
      - name: Configure optional YouTube authentication
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: python -m scripts.prepare_cookies
      - name: Start YouTube proof-of-origin token provider
        # The bgutil plugin (installed with the package) asks this local server for PO tokens.
        continue-on-error: true
        run: docker run --name bgutil-provider -d --init -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider
      - name: Prepare optional WARP fallback route for trailer downloads
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/warp_proxy.sh
      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: work/models
          key: models-cpu-v3-thumbnails-${{ runner.os }}-${{ env.TTS_MODEL }}-${{ env.SCRIPT_MODEL }}
          restore-keys: models-cpu-v2-${{ runner.os }}-${{ env.TTS_MODEL }}-${{ env.SCRIPT_MODEL }}
      - name: Restore speech and script checkpoints
        uses: actions/cache/restore@v4
        with:
          path: work/jobs
          key: production-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            production-v2-${{ github.run_id }}-
            production-v2-
      - name: Restore optional speech recognizer
        id: speech-verifier-cache
        uses: actions/cache/restore@v4
        with:
          path: work/speech-verifier-model
          key: models-cpu-speech-verifier-v1-${{ runner.os }}
      - name: Install CPU speech model and analysis dependencies
        run: |
          python -m pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[voice,thumbnails]'
          # Demucs (dialogue separation) pins an old torchaudio; install it without dependencies
          # plus the light libraries it imports, so Chatterbox's torch stack is left untouched.
          python -m pip install --no-deps demucs==4.0.1 openunmix==1.3.0
          python -m pip install dora-search julius einops omegaconf tqdm pyyaml
          # SigLIP 2 shot matching through OpenCLIP (Chatterbox pins a transformers version without
          # SigLIP 2). torchvision matches the pinned torch; the rest install without dependencies.
          python -m pip install torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-deps open_clip_torch==2.32.0 timm==1.0.15
          python -m pip install ftfy regex
      - name: Install durable checkpoint helper
        run: npm install --prefix .github/actions/resilient-production --omit=dev --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Produce the complete package
        uses: ./.github/actions/resilient-production
      - name: Render review frames from the finished video
        continue-on-error: true
        run: python -m scripts.review_package
      - name: Attach paid model and estimated budget receipts
        if: always() && !cancelled()
        run: python -m scripts.paid_trial_preflight --receipts
      - name: Thumbnail reference and candidate audit
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: paid-thumbnail-audit-${{ github.run_number }}
          path: work/paid-thumbnails/
          if-no-files-found: ignore
          retention-days: 2
      - name: Downloadable video package
        uses: actions/upload-artifact@v4
        with:
          name: movie-video-${{ github.run_number }}
          path: output/
          if-no-files-found: error
          retention-days: 2
      - name: Bounded Gemini usage and capability diagnostics
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-usage-produce
          path: |
            work/gemini-usage-*.jsonl
            work/gemini-preflight-*.json
          if-no-files-found: ignore
          retention-days: 2
      - name: Runner resource diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-diagnostics-${{ github.run_number }}-${{ github.run_attempt }}
          path: work/runner-diagnostics/
          if-no-files-found: ignore
          retention-days: 2
      - name: Bounded audio inspection samples
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: audio-inspection-${{ github.run_number }}
          path: |
            work/jobs/*/voice-dry.wav
            work/jobs/*/voice-before-pacing.wav
            work/jobs/*/voice-after-pacing.wav
            work/jobs/*/finished-mix.wav
            work/jobs/*/ending-music-only.wav
            work/jobs/*/background-only.wav
            work/jobs/*/edit-without-music.wav
            work/jobs/*/soundtrack-report.json
            work/jobs/*/audio-review.json
            work/jobs/*/comparison-audio-review.json
            work/jobs/*/comparison/augmentation-report.json
          if-no-files-found: ignore
          retention-days: 2
      - name: Speech diagnostics if production fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: speech-diagnostics-${{ github.run_number }}
          path: |
            work/jobs/*/speech-checks/speech-verification.json
            work/jobs/*/speech-checks/last-unverified.wav
            work/jobs/*/audio-assembly.json
            work/jobs/*/audio-review.json
            work/jobs/*/comparison-audio-review.json
          if-no-files-found: ignore
          retention-days: 2
      - name: Remove downloaded trailers and rendered intermediates
        if: always()
        run: python -m scripts.cleanup_work
      - name: Save bounded speech and script checkpoints
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: work/jobs
          key: production-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Remove temporary YouTube cookies
        if: always()
        run: rm -f "$RUNNER_TEMP/youtube-cookies.txt"
      - name: Save shot analyses for later runs
        if: always() && !cancelled() && hashFiles('work/analysis-cache/*.json') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: work/analysis-cache
          key: shot-analysis-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save optional speech recognizer when downloaded
        if: always() && !cancelled() && steps.speech-verifier-cache.outputs.cache-hit != 'true' && hashFiles('work/speech-verifier-model/**/config.json') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: work/speech-verifier-model
          key: models-cpu-speech-verifier-v1-${{ runner.os }}
