name: Runner reliability validation
on:
  workflow_dispatch:
  push:
    branches: [fix/runner-reliability]
    paths:
      - scripts/**
      - movie_pipeline/core.py
      - movie_pipeline/research.py
      - .github/actions/resilient-production/**
      - .github/workflows/runner-reliability-validation.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: runner-reliability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the small verification dependencies
        run: |
          python -m pip install requests
          npm install --prefix .github/actions/resilient-production --omit=dev --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Test checkpoint scheduling, redaction and recovery helpers
        run: node --test .github/actions/resilient-production/index.test.cjs
      - name: Exercise actual cgroup limits, application exits and host survival
        run: python -m scripts.reliability_smoke guard
      - name: Exercise durable uploads while a workload is running
        uses: ./.github/actions/resilient-production
        with:
          command-json: '["python3", "-m", "scripts.reliability_smoke", "checkpoint-fixture"]'
          checkpoint-interval-seconds: '3'
      - name: Verify the formerly failing short show title
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
        run: python -m scripts.reliability_smoke research
      - name: Download uploaded checkpoints for round-trip inspection
        uses: actions/download-artifact@v4
        with:
          pattern: reliable-checkpoint-*
          path: checkpoint-roundtrip
      - name: Restore a saved checkpoint into an isolated directory
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          archives = sorted(Path("checkpoint-roundtrip").rglob("*.tar.gz"))
          if not archives:
              raise SystemExit("No durable checkpoint archive was uploaded.")
          restored = Path("restored-checkpoint").resolve()
          restored.mkdir(parents=True, exist_ok=True)
          subprocess.run([sys.executable, "-m", "scripts.checkpoint_snapshot", "restore",
                          "--archive", str(archives[-1].resolve()), "--workspace", str(restored)], check=True)
          files = list(restored.glob("work/jobs/*/script.json"))
          if not files or not any(json.loads(path.read_text()).get("fixture") == "checkpoint-roundtrip" for path in files):
              raise SystemExit("The uploaded checkpoint did not restore the running workload's script.")
          print("DURABLE_CHECKPOINT_ROUNDTRIP passed")
          PY
      - name: Inspectable resource reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-reliability-report
          path: |
            work/runner-smoke/
            work/runner-diagnostics/
          retention-days: 2
          if-no-files-found: ignore
